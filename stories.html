<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">
    <title>GymNerd | Last Month</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="gn-i18n.js"></script>
    <script src="auth.js"></script>
    <script src="drive-storage.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
    <script src="db.js"></script>
    <script src="stat_calculator.js"></script>
    <script src="background-sync.js"></script>
    <link rel="stylesheet" href="styles/app-titles.css">
    <link rel="stylesheet" href="styles/mode-support.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/material-symbols.css">
    <script src="icons/material-symbols-data.js"></script>
    <script src="icons/material-symbols.js"></script>
    <style>
        :root { 
            --bg: #000; 
            --text: #fff; 
            --primary: var(--accent-color, #f2c24b);
            --safe-top: constant(safe-area-inset-top);
            --safe-top: env(safe-area-inset-top);
        }
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text);
            font-family: var(--app-font-family, sans-serif);
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        /* Story Container */
        .story-container {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            background: #000;
            z-index: 2000;
            touch-action: manipulation;
        }

        /* Progress Bars */
        .story-progress-container {
            position: absolute;
            top: calc(10px + var(--safe-top, 0px));
            left: 10px;
            right: 10px;
            display: flex;
            gap: 4px;
            z-index: 10;
        }
        .story-progress-bar {
            height: 3px;
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }
        .story-progress-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            transition: width 0.1s linear;
        }
        .story-container.paused .story-progress-fill {
            transition: none !important;
        }

        .story-month-header {
            position: absolute;
            top: calc(28px + var(--safe-top, 0px));
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.5);
            z-index: 10;
            pointer-events: none;
        }

        /* Pages */
        .story-pages {
            flex: 1;
            position: relative;
        }
        .story-page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            align-items: center;
            justify-content: flex-start;
            padding: 80px 24px 40px;
            box-sizing: border-box;
            text-align: center;
        }
        .story-page.active { display: flex; }
        
        .story-content-inner {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            max-height: 100%;
        }

        /* Navigation */
        .story-nav {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            z-index: 5;
        }
        .story-nav-prev { width: 25%; height: 100%; }
        .story-nav-pause { flex: 1; height: 100%; }
        .story-nav-next { width: 50%; height: 100%; }

        .story-close {
            position: absolute;
            top: calc(20px + var(--safe-top, 0px));
            right: 15px;
            z-index: 11;
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .story-ok-btn {
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            z-index: 12;
            border: 0;
            border-radius: 14px;
            padding: 16px 20px;
            background: var(--accent-color);
            color: var(--text-on-accent-color);
            font: inherit;
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
        }

        /* Content Styles */
        .story-title { font-size: 3.5rem; font-weight: 900; margin: 0; color: var(--primary); letter-spacing: -0.04em; line-height: 1; }
        .stat-label { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; font-weight: 800; letter-spacing: 0.1em; }

        /* Frequency Text Styles */
        .frequency-text-container, .improvements-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            text-align: left;
            padding: 0 10px;
        }
        .frequency-text-item, .improvement-item {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.2;
            opacity: 0;
            transform: translateY(20px);
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }
        .freq-icon {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        .freq-text-content, .improvement-text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .story-page.active.animating .frequency-text-item,
        .story-page.active.animating .improvement-item {
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        .freq-count, .improvement-val { color: var(--primary); font-size: 2.2rem; }
        .freq-delta, .improvement-delta {
            font-size: 0.85rem;
            display: inline-block;
            margin-left: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 900;
            vertical-align: baseline;
        }
        .delta-plus { color: #4ade80; }
        .delta-minus { color: #f87171; }
        .delta-neutral { color: #94a3b8; }

        /* Improvements - Dynamic Layout */
        .improvements-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            padding: 20px 0;
        }
        .improvement-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateX(-20px);
            box-sizing: border-box;
        }

        .story-page.active.animating .improvement-item:nth-child(1) { animation: fadeInLeft 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.2s; }
        .story-page.active.animating .improvement-item:nth-child(2) { animation: fadeInLeft 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.4s; }
        .story-page.active.animating .improvement-item:nth-child(3) { animation: fadeInLeft 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.6s; }
        
        /* Specific animations for losses container on page 3 */
        #page3.active.animating .improvement-item:nth-child(1) { animation: fadeInLeft 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.2s; }
        #page3.active.animating .improvement-item:nth-child(2) { animation: fadeInLeft 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.4s; }
        #page3.active.animating .improvement-item:nth-child(3) { animation: fadeInLeft 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.6s; }

        .improvement-rank {
            font-size: 3rem;
            font-weight: 900;
            -webkit-text-stroke: 1px rgba(255,255,255,0.3);
            color: transparent;
            line-height: 1;
            width: 40px;
            flex-shrink: 0;
            pointer-events: none;
        }

        .improvement-icon-wrapper {
            width: 120px;
            height: 80px;
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff !important;
            background-color: #ffffff !important;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: none;
        }
        .improvement-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .improvement-text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }
        .improvement-val {
            font-size: 2rem;
            font-weight: 900;
            line-height: 1;
            color: #4ade80;
            letter-spacing: -0.04em;
            white-space: nowrap;
        }

        /* Type Status Styles */
        .type-status-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            padding: 10px 0;
            overflow-y: auto;
            max-height: calc(100vh - 200px);
        }
        .type-status-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transform: translateY(10px);
        }
        .story-page.active.animating .type-status-item {
            animation: fadeInUp 0.5s ease-out forwards;
        }
        .type-status-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .type-status-name {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: rgba(255,255,255,0.8);
        }
        .type-status-trend {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2rem;
            font-weight: 900;
        }
        .trend-icon { font-size: 24px; }

        /* Outcome Styles */
        .outcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            max-width: 320px;
            width: 100%;
            margin-bottom: 40px;
            position: relative;
        }
        .outcome-bg-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
            animation: pulseGlow 4s ease-in-out infinite;
        }
        .outcome-illustration {
            width: 200px;
            height: 200px;
            filter: drop-shadow(0 12px 32px rgba(0,0,0,0.6));
            opacity: 0;
            transform: scale(0.8);
            z-index: 2;
        }
        .story-page.active.animating .outcome-illustration {
            animation: bounceIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1.2) forwards, bob 3s ease-in-out infinite 0.8s;
        }
        .outcome-message {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.2;
            text-align: center;
            white-space: pre-line;
            opacity: 0;
            transform: translateY(30px) rotate(-1deg);
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        .story-page.active.animating .outcome-message {
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.3s;
        }
        
        /* Focus Area Styles */
        .focus-area-container {
            width: 100%;
            margin-top: auto;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(20px);
        }
        .story-page.active.animating .focus-area-container {
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.6s;
        }
        .focus-title {
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.4);
        }
        .focus-types {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        .focus-type-tag {
            padding: 6px 14px;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.2);
            border-radius: 100px;
            color: #f87171;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Disclaimer Style */
        .story-disclaimer {
            position: absolute;
            bottom: calc(20px + var(--safe-top, 0px));
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            pointer-events: none;
            z-index: 10;
        }
        .disclaimer-icon { font-size: 14px !important; }

        /* Happy Sparkles */
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0;
            z-index: 1;
        }
        .story-page.active.animating .sparkle {
            animation: sparkleAnim 1.5s ease-out forwards;
        }

        /* KEYFRAME ANIMATIONS */
        @keyframes pulseGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.5; }
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes sparkleAnim {
            0% { transform: translate(0, 0) scale(0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; }
        }
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeInLeft {
            0% { transform: translateX(-20px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes dropIn {
            0% { transform: scale(1.6) translateY(-40px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes fadeInUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* TRIGGER CLASSES */
        .story-page.active .story-title {
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="story-container">
            <div class="story-progress-container" id="progressContainer"></div>
            <div class="story-month-header" id="storyMonthHeader"></div>
            <a href="#" class="story-close" id="storyCloseBtn">
                <span class="material-symbols-outlined">close</span>
            </a>

            <div class="story-nav">
                <div class="story-nav-prev" id="navPrev"></div>
                <div class="story-nav-pause" id="navPause"></div>
                <div class="story-nav-next" id="navNext"></div>
            </div>

            <div class="story-pages" id="pagesContainer">
                <!-- Page 1: Frequency -->
                <div class="story-page" id="page1">
                    <div class="story-content-inner" style="align-items: flex-start; text-align: left;">
                        <h2 class="story-title" data-i18n="workout_frequency" style="margin-bottom: 20px;">Frequency</h2>
                        <div id="frequencyTextContainer" class="frequency-text-container"></div>
                    </div>
                    <div class="story-disclaimer">
                        <span class="material-symbols-outlined disclaimer-icon">info</span>
                        <span class="disclaimer-text"></span>
                    </div>
                </div>

                <!-- Page 2: Top 3 gains -->
                <div class="story-page" id="page2">
                    <div class="story-content-inner" style="align-items: flex-start; text-align: left;">
                        <h2 class="story-title" data-i18n="story_top_gains">Top 3 gains</h2>
                        <div id="improvementsContainer" class="improvements-container"></div>
                    </div>
                    <div class="story-disclaimer">
                        <span class="material-symbols-outlined disclaimer-icon">info</span>
                        <span class="disclaimer-text"></span>
                    </div>
                </div>

                <!-- Page 3: Top 3 losses -->
                <div class="story-page" id="page3">
                    <div class="story-content-inner" style="align-items: flex-start; text-align: left;">
                        <h2 class="story-title" data-i18n="story_top_losses">Top 3 losses</h2>
                        <div id="lossesContainer" class="improvements-container"></div>
                    </div>
                    <div class="story-disclaimer">
                        <span class="material-symbols-outlined disclaimer-icon">info</span>
                        <span class="disclaimer-text"></span>
                    </div>
                </div>

                <!-- Page 4: Type Status -->
                <div class="story-page" id="page4">
                    <div class="story-content-inner" style="align-items: flex-start; text-align: left;">
                        <h2 class="story-title" data-i18n="story_type_status">Type status</h2>
                        <div id="typeStatusContainer" class="type-status-container"></div>
                    </div>
                    <div class="story-disclaimer">
                        <span class="material-symbols-outlined disclaimer-icon">info</span>
                        <span class="disclaimer-text"></span>
                    </div>
                </div>

                <!-- Page 5: Monthly Outcome -->
                <div class="story-page" id="page5">
                    <div class="story-content-inner" style="justify-content: center; height: 100%;">
                        <div id="outcomeContainer" class="outcome-container"></div>
                    </div>
                    <button type="button" class="story-ok-btn" id="storyOkBtn">OK</button>
                    <div class="story-disclaimer">
                        <span class="material-symbols-outlined disclaimer-icon">info</span>
                        <span class="disclaimer-text"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
(function() {
    let currentPage = 0;
    let progressInterval;
    let startTime;
    let isPaused = false;
    let pausedAt = 0;
    const DURATION = 6000;

    async function initStory() {
        try {
            document.body.style.overflow = 'hidden';
            const container = document.querySelector('.main-content');
            if (container) {
                container.style.margin = '0';
                container.style.maxWidth = 'none';
                container.style.padding = '0';
            }
        } catch(e){}

        if (window.GN_I18N) GN_I18N.applyTranslations(document);
        
        const now = new Date();
        const year = now.getMonth() === 0 ? now.getFullYear() - 1 : now.getFullYear();
        const month = now.getMonth() === 0 ? 11 : now.getMonth() - 1;

        const currentLang = (window.GN_I18N && typeof GN_I18N.safeGetLang === 'function') ? GN_I18N.safeGetLang() : 'en';
        const displayDate = new Date(year, month, 1);
        const monthHeader = document.getElementById('storyMonthHeader');
        if (monthHeader) {
            monthHeader.innerText = displayDate.toLocaleString(currentLang, { month: 'long', year: 'numeric' });
        }

        const startStr = `${year}-${String(month + 1).padStart(2, '0')}-01`;
        const lastDay = new Date(year, month + 1, 0).getDate();
        const endStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;

        try {
            if (window.db) {
                await db.open();
                const logs = await db.history.where('date').between(startStr, endStr, true, true).toArray();
                const uniqueDates = [...new Set(logs.map(l => l.date))];
                const frozenDays = await db.frozen_days.where('date').between(startStr, endStr, true, true).toArray();

                // Previous month counts (2nd month ago) for comparison
                const prevMonthDate = new Date(year, month - 1, 1);
                const pYear = prevMonthDate.getFullYear();
                const pMonth = prevMonthDate.getMonth();
                const pStart = `${pYear}-${String(pMonth + 1).padStart(2, '0')}-01`;
                const pEnd = `${pYear}-${String(pMonth + 1).padStart(2, '0')}-${String(new Date(pYear, pMonth + 1, 0).getDate()).padStart(2, '0')}`;
                
                const pLogs = await db.history.where('date').between(pStart, pEnd, true, true).toArray();
                const pDone = [...new Set(pLogs.map(l => l.date))].length;
                const pFrozen = await db.frozen_days.where('date').between(pStart, pEnd, true, true).count();
                const pDays = new Date(pYear, pMonth + 1, 0).getDate();
                const pMissed = pDays - pDone - pFrozen;

                const pMonthName = prevMonthDate.toLocaleString(currentLang, { month: 'long' });

                // Set disclaimers
                const comparedWith = (window.GN_I18N && typeof GN_I18N.t === 'function') ? GN_I18N.t('from') : 'from';
                const disclaimerText = `${comparedWith} ${pMonthName}`;
                document.querySelectorAll('.disclaimer-text').forEach(el => el.innerText = disclaimerText);
                document.querySelectorAll('#page5 .story-disclaimer')
                    .forEach(el => el.style.display = 'none');
                document.querySelectorAll('#page2 .disclaimer-text, #page3 .disclaimer-text, #page4 .disclaimer-text')
                    .forEach(el => el.innerText = 'Using 1RM calculation');

                const frequencyStats = {
                    done: uniqueDates.length,
                    rest: frozenDays.length,
                    missed: Math.max(0, lastDay - uniqueDates.length - frozenDays.length),
                    prevDone: pDone,
                    prevRest: pFrozen,
                    prevMissed: pMissed,
                    diff: uniqueDates.length - pDone,
                    monthName: pMonthName
                };

                renderTextFrequencyStory(uniqueDates.length, frozenDays.length, year, month, { done: pDone, rest: pFrozen, missed: pMissed, monthName: pMonthName });
                const improvementPages = await renderImprovementsStory(logs, currentLang, frequencyStats);
                if (!improvementPages || !improvementPages.hasGains) {
                    const gainsPage = document.getElementById('page2');
                    if (gainsPage) gainsPage.remove();
                }
                if (!improvementPages || !improvementPages.hasLosses) {
                    const lossesPage = document.getElementById('page3');
                    if (lossesPage) lossesPage.remove();
                }
            }
        } catch (e) {
            console.error('Story data load failed', e);
        }

        const pages = document.querySelectorAll('.story-page');
        const progressContainer = document.getElementById('progressContainer');
        if (progressContainer) {
            progressContainer.innerHTML = '';
            pages.forEach(() => {
                const bar = document.createElement('div');
                bar.className = 'story-progress-bar';
                bar.innerHTML = '<div class="story-progress-fill"></div>';
                progressContainer.appendChild(bar);
            });
        }

        setTimeout(() => showPage(0), 100);
    }

    async function renderImprovementsStory(currentLogs, lang, frequencyStats) {
        const gainsContainer = document.getElementById('improvementsContainer');
        const lossesContainer = document.getElementById('lossesContainer');
        if (!gainsContainer || !lossesContainer) return { hasGains: false, hasLosses: false };
        gainsContainer.innerHTML = '';
        lossesContainer.innerHTML = '';

        const normalizeExerciseType = (type) => {
            const raw = (type === undefined || type === null) ? '' : String(type);
            const trimmed = raw.trim();
            const label = trimmed || 'Other';
            return {
                key: label.toLowerCase(),
                label
            };
        };

        const safeMetricValue = (value, precision = 2) => {
            const num = Number(value);
            if (!Number.isFinite(num)) return 0;
            if (precision >= 0) return Number(num.toFixed(precision));
            return num;
        };

        const getStrength1RMSeries = (entries) => {
            if (!Array.isArray(entries)) return [];
            const byDate = {};
            entries.forEach(entry => {
                const d = entry.date;
                if (!d) return;
                const weight = Number(entry && entry.weight) || 0;
                const reps = (entry && entry.reps !== undefined && entry.reps !== null)
                    ? Number(entry.reps)
                    : 1;
                const current1RM = window.estimate1RM(weight, reps);
                if (!byDate[d] || current1RM > byDate[d]) {
                    byDate[d] = current1RM;
                }
            });

            return Object.keys(byDate)
                .sort((a, b) => new Date(a) - new Date(b))
                .map(d => safeMetricValue(byDate[d]));
        };

        const getProgressData = (values) => {
            if (!values || values.length < 2) return null;
            const first = values[0];
            const last = values[values.length - 1];
            if (!first || !last) return null;
            const diff = last - first;
            const percent = (diff / first) * 100;
            if (Math.abs(percent) < 0.1 || diff === 0) return null;
            return { diff, percent, first, last };
        };

        const getGroupProgressData = (exercisesInType) => {
            let sumPercent = 0;
            let sumDelta = 0;
            let count = 0;

            Object.values(exercisesInType || {}).forEach((entries) => {
                const series = getStrength1RMSeries(entries)
                    .map(v => Number(v))
                    .filter(v => Number.isFinite(v));
                const progress = getProgressData(series);
                if (!progress) return;
                sumPercent += progress.percent;
                sumDelta += progress.diff;
                count++;
            });

            if (count === 0) return null;
            const avgPercent = sumPercent / count;
            if (Math.abs(avgPercent) < 0.1) return null;
            return {
                percent: avgPercent,
                diff: sumDelta / count
            };
        };

        // Fetch exercise details
        const [catEx, custEx, catImg, custImg] = await Promise.all([
            db.catalog_exercises.toArray(),
            db.custom_exercises.toArray(),
            db.catalog_images.toArray(),
            db.custom_images.toArray()
        ]);

        const catMap = new Map(catEx.map(e => [e.id, e]));
        const custMap = new Map(custEx.map(e => [e.id, e]));
        const catImgMap = new Map(catImg.map(i => [i.id, i.data || i.url]));
        const custImgMap = new Map(custImg.map(i => [i.id, i.data || i.url]));

        const allExercises = [
            ...catEx.map(ex => ({ ...ex, isCustom: false })),
            ...custEx.map(ex => ({ ...ex, isCustom: true }))
        ];

        const exMap = allExercises.reduce((acc, ex) => {
            acc[`${ex.id}-${!!ex.isCustom}`] = ex;
            return acc;
        }, {});

        const groupedByType = {};
        const exerciseStats = [];

        currentLogs.forEach(log => {
            if (!log || !log.exerciseId || !log.date) return;
            const isCustom = log.isCustom !== undefined ? !!log.isCustom : Number(log.exerciseId) > 0;
            const exKey = `${log.exerciseId}-${isCustom}`;
            const ex = exMap[exKey];
            const typeInfo = normalizeExerciseType(ex ? ex.type : 'Other');

            if (!groupedByType[typeInfo.key]) {
                groupedByType[typeInfo.key] = { label: typeInfo.label, localizedLabel: null, exercises: {} };
            }

            if (!groupedByType[typeInfo.key].exercises[exKey]) {
                groupedByType[typeInfo.key].exercises[exKey] = [];
            }
            groupedByType[typeInfo.key].exercises[exKey].push(log);
        });

        Object.keys(groupedByType).forEach(typeKey => {
            Object.keys(groupedByType[typeKey].exercises).forEach(exKey => {
                const entries = groupedByType[typeKey].exercises[exKey];
                const progress = getProgressData(getStrength1RMSeries(entries));
                if (!progress) return;
                const ex = exMap[exKey];
                if (!ex) return;
                exerciseStats.push({
                    exerciseKey: exKey,
                    exercise: ex,
                    typeKey,
                    current: progress.last,
                    prev: progress.first,
                    percent: progress.percent,
                    diff: progress.diff
                });
            });
        });

        const typeStats = Object.keys(groupedByType).map(typeKey => {
            const entry = groupedByType[typeKey];
            const localizedLabel =
                (window.GN_I18N && typeof GN_I18N.localizeExerciseType === 'function')
                    ? (GN_I18N.localizeExerciseType(entry.label) || entry.label)
                    : entry.label;
            return {
                key: typeKey,
                label: entry.label,
                localizedLabel,
                progress: getGroupProgressData(entry.exercises)
            };
        });

        const gains = exerciseStats.filter(s => s.diff > 0).sort((a, b) => b.diff - a.diff).slice(0, 3);
        const losses = exerciseStats.filter(s => s.diff < 0).sort((a, b) => a.diff - b.diff).slice(0, 3);

        const renderItems = (items, container, isLoss = false) => {
            if (items.length === 0) {
                return;
            }

            items.forEach((imp, index) => {
                const ex = imp.exercise;
                if (!ex) return;

                const imgData = custImgMap.get(ex.imageId) || catImgMap.get(ex.imageId) || 'icons/icon-192.svg';
                const div = document.createElement('div');
                div.className = 'improvement-item';
                
                const diffVal = Math.abs(imp.diff).toFixed(1);
                const color = isLoss ? '#f87171' : '#4ade80';
                const sign = isLoss ? '-' : '+';

                div.innerHTML = `
                    <div class="improvement-rank">${index + 1}</div>
                    <div class="improvement-icon-wrapper">
                        <img src="${imgData}" class="improvement-icon">
                    </div>
                    <div class="improvement-text-content">
                        <span class="improvement-val" style="color: ${color}">${sign}${diffVal} KG</span>
                    </div>
                `;
                container.appendChild(div);
            });
        };

        renderItems(gains, gainsContainer, false);
        renderItems(losses, lossesContainer, true);

        await renderTypeStatusStory(typeStats, lang);
        renderOutcomeStory(typeStats, lang, frequencyStats);

        return {
            hasGains: gains.length > 0,
            hasLosses: losses.length > 0
        };
    }

    function renderOutcomeStory(typeStats, lang, frequencyStats) {
        const container = document.getElementById('outcomeContainer');
        if (!container) return;
        container.innerHTML = '';

        const escapeHtml = (value) => String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');

        const now = new Date();
        const nextMonthDate = new Date(now.getFullYear(), now.getMonth(), 1);
        let nextMonthName = nextMonthDate.toLocaleString(lang, { month: 'long' });
        if (lang === 'pt') {
            nextMonthName = nextMonthName.charAt(0).toUpperCase() + nextMonthName.slice(1);
        }

        const types = Array.isArray(typeStats) ? typeStats : [];
        const progressed = types.filter(type => type && type.progress && type.progress.percent > 0);
        const declined = types.filter(type => type && type.progress && type.progress.percent < 0);
        const steady = types.filter(type => !type || !type.progress || type.progress.percent === 0);
        const workoutsDone = Number(frequencyStats && frequencyStats.done) || 0;
        const previousWorkoutsDone = Number(frequencyStats && frequencyStats.prevDone) || 0;
        const workoutDiff = workoutsDone - previousWorkoutsDone;
        const hasFrequencyComparison = previousWorkoutsDone > 0 || workoutsDone > 0;
        const frequencyDeclined = hasFrequencyComparison && workoutDiff < 0;

        const getOutcomeText = (key, fallback) => {
            const template = (window.GN_I18N && typeof GN_I18N.t === 'function') ? (GN_I18N.t(key) || fallback) : fallback;
            return String(template).replace('{m}', nextMonthName);
        };

        const allTypesImproved = types.length > 0 && progressed.length === types.length;
        const mostTypesDeclined = types.length > 0 && declined.length > (types.length / 2);
        const hasTypeDecline = declined.length > 0;
        let outcomeMood = 'mixed';

        if (allTypesImproved && !frequencyDeclined) {
            outcomeMood = 'positive';
        } else if (frequencyDeclined || mostTypesDeclined) {
            outcomeMood = 'negative';
        }

        let illustration = 'illustrations/flamo-happy-rest.svg';
        let message = getOutcomeText('story_outcome_mixed_loss', 'Mixed progress.');

        if (outcomeMood === 'positive') {
            illustration = 'illustrations/flamo-happy-15-plus.svg';
            message = getOutcomeText('story_outcome_all_growth', 'You did amazing!');
        } else if (outcomeMood === 'negative') {
            illustration = 'illustrations/flamo-sad-6-8.svg';
            if (frequencyDeclined && hasTypeDecline) {
                message = getOutcomeText('story_outcome_negative_frequency_and_types', 'Frequency is down. Some exercise types dropped.');
            } else if (frequencyDeclined) {
                message = getOutcomeText('story_outcome_negative_frequency', 'Frequency is down.');
            } else {
                message = getOutcomeText('story_outcome_negative_types', 'Most exercise types dropped.');
            }
        } else if (hasTypeDecline) {
            message = getOutcomeText('story_outcome_mixed_loss', 'Mixed progress.');
        }

        const isHappy = outcomeMood === 'positive';
        const glowColor = isHappy ? 'var(--primary)' : '#4d94ff';

        let sparklesHtml = '';
        if (isHappy) {
            for (let i = 0; i < 12; i++) {
                const tx = (Math.random() - 0.5) * 400;
                const ty = (Math.random() - 0.5) * 400;
                const delay = Math.random() * 0.5;
                sparklesHtml += `<div class="sparkle" style="--tx: ${tx}px; --ty: ${ty}px; animation-delay: ${delay}s; left: 50%; top: 50%;"></div>`;
            }
        }

        const focusTitle = (window.GN_I18N && typeof GN_I18N.t === 'function')
            ? (GN_I18N.t('story_focus_title') || 'You could focus on')
            : 'You could focus on';
        const focusTypes = declined
            .concat(steady)
            .sort((a, b) => {
                const left = a && a.progress ? a.progress.percent : 0;
                const right = b && b.progress ? b.progress.percent : 0;
                return left - right;
            })
            .map(type => escapeHtml(type.localizedLabel || type.label || type.key))
            .filter(Boolean);
        const focusHtml = focusTypes.length
            ? `
                <div class="focus-area-container">
                    <div class="focus-title">${escapeHtml(focusTitle)}</div>
                    <div class="focus-types">
                        ${focusTypes.map(label => `<span class="focus-type-tag">${label}</span>`).join('')}
                    </div>
                </div>
            `
            : '';

        container.innerHTML = `
            <div class="outcome-bg-glow" style="background: ${glowColor}"></div>
            ${sparklesHtml}
            <img src="${illustration}" class="outcome-illustration" alt="">
            <div class="outcome-message">${escapeHtml(message)}</div>
            ${focusHtml}
        `;
    }

    async function renderTypeStatusStory(typeStats, lang) {
        const container = document.getElementById('typeStatusContainer');
        if (!container) return;
        container.innerHTML = '';

        const types = (Array.isArray(typeStats) ? typeStats : [])
            .filter(Boolean)
            .sort((a, b) => {
                const left = a.localizedLabel || a.label || a.key;
                const right = b.localizedLabel || b.label || b.key;
                return left.localeCompare(right);
            });

        if (types.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'type-status-item';
            empty.innerText = (window.GN_I18N && typeof GN_I18N.t === 'function') ? GN_I18N.t('no_exercise_data_found') : 'No data';
            container.appendChild(empty);
            return;
        }

        types.forEach((type, index) => {
            const localizedName = type.localizedLabel || type.label || type.key;

            const div = document.createElement('div');
            div.className = 'type-status-item';
            div.style.animationDelay = `${(index + 1) * 0.15}s`;

            let color = '#94a3b8';
            let icon = 'remove';
            let trendText = '';

            if (type.progress) {
                const fixedDiff = Number(type.progress.diff.toFixed(1));
                const fixedPercent = Number(type.progress.percent.toFixed(1));
                trendText = `${fixedDiff > 0 ? '+' : ''}${fixedDiff.toFixed(1)} KG`;

                if (fixedPercent > 0) {
                    color = '#4ade80';
                    icon = 'trending_up';
                } else if (fixedPercent < 0) {
                    color = '#f87171';
                    icon = 'trending_down';
                }
            }

            div.innerHTML = `
                <div class="type-status-info">
                    <span class="type-status-name">${localizedName}</span>
                </div>
                <div class="type-status-trend" style="color: ${color}">
                    ${trendText ? `<span>${trendText}</span>` : ''}
                    <span class="material-symbols-outlined trend-icon">${icon}</span>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function renderTextFrequencyStory(doneCount, restCount, year, month, prevCounts) {
        const container = document.getElementById('frequencyTextContainer');
        if (!container) return;
        
        container.innerHTML = '';
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const missedCount = daysInMonth - doneCount - restCount;

        const summaryItems = [
            { count: doneCount, prev: prevCounts?.done || 0, type: 'done', labelKey: 'story_freq_done', icon: 'icons/day-done.svg' },
            { count: restCount, prev: prevCounts?.rest || 0, type: 'rest', labelKey: 'story_freq_rest', icon: 'icons/day-rest.svg' },
            { count: missedCount, prev: prevCounts?.missed || 0, type: 'missed', labelKey: 'story_freq_missed', icon: 'icons/day-missed.svg' }
        ];

        summaryItems.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'frequency-text-item';
            div.style.animationDelay = `${(index + 1) * 0.4}s`;
            
            const diff = item.count - item.prev;
            const sign = diff > 0 ? '+' : '';
            const deltaVal = diff === 0 ? '0' : `${sign}${diff}`;
            const fromMonth = (window.GN_I18N && typeof GN_I18N.t === 'function') ? GN_I18N.t('from') : 'from';
            
            let deltaClass = 'delta-neutral';
            if (diff > 0) {
                deltaClass = item.type === 'missed' ? 'delta-minus' : (item.type === 'rest' ? 'delta-neutral' : 'delta-plus');
            } else if (diff < 0) {
                deltaClass = item.type === 'missed' ? 'delta-plus' : (item.type === 'rest' ? 'delta-neutral' : 'delta-minus');
            }

            const deltaHtml = diff !== 0 ? `<span class="freq-delta ${deltaClass}">(${deltaVal})</span>` : '';
            
            let template = (window.GN_I18N && typeof GN_I18N.t === 'function') ? GN_I18N.t(item.labelKey) : item.labelKey;
            const text = template.replace('{n}', `<span class="freq-count">${item.count}</span>`);
            
            div.innerHTML = `
                <img src="${item.icon}" class="freq-icon">
                <div class="freq-text-content">
                    <div style="display: flex; align-items: baseline;">
                        <span>${text}</span>
                        ${deltaHtml}
                    </div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function showPage(index) {
        const pages = document.querySelectorAll('.story-page');
        if (!pages.length || index < 0 || index >= pages.length) return;
        
        const container = document.querySelector('.story-container');
        if (container) container.classList.remove('paused');
        
        if (progressInterval) clearInterval(progressInterval);
        
        pages.forEach(p => {
            p.classList.remove('active');
            p.classList.remove('animating');
            p.style.display = 'none';
        });
        
        currentPage = index;
        const page = pages[currentPage];
        const isLastPage = currentPage === pages.length - 1;
        const closeBtn = document.getElementById('storyCloseBtn');
        if (closeBtn) closeBtn.style.display = isLastPage ? 'none' : 'flex';
        page.style.display = 'flex';
        page.classList.add('active');
        
        setTimeout(() => {
            if (document.body.contains(page)) {
                page.classList.add('animating');
            }
        }, 10);

        const fills = document.querySelectorAll('.story-progress-fill');
        fills.forEach((fill, i) => {
            if (i < index) fill.style.width = '100%';
            else fill.style.width = '0%';
        });

        isPaused = false;
        pausedAt = 0;
        startTime = Date.now();
        progressInterval = setInterval(() => {
            if (!document.body.contains(pages[0])) {
                clearInterval(progressInterval);
                return;
            }
            if (isPaused) return;

            const elapsed = Date.now() - startTime;
            const progress = (elapsed / DURATION) * 100;
            
            if (progress >= 100) {
                if (fills[index]) fills[index].style.width = '100%';
                if (currentPage < pages.length - 1) {
                    nextPage();
                } else {
                    clearInterval(progressInterval);
                }
            } else {
                if (fills[index]) fills[index].style.width = progress + '%';
            }
        }, 30);
    }

    function pause() {
        if (isPaused) return;
        isPaused = true;
        pausedAt = Date.now();
        const container = document.querySelector('.story-container');
        if (container) container.classList.add('paused');
    }

    function resume() {
        if (!isPaused) return;
        isPaused = false;
        const container = document.querySelector('.story-container');
        if (container) container.classList.remove('paused');
        const pauseDuration = Date.now() - pausedAt;
        startTime += pauseDuration;
    }

    function nextPage() {
        const pages = document.querySelectorAll('.story-page');
        if (currentPage < pages.length - 1) {
            showPage(currentPage + 1);
            return;
        }

        if (progressInterval) clearInterval(progressInterval);
        leaveStory();
    }

    function prevPage() {
        if (currentPage > 0) showPage(currentPage - 1);
    }

    const nPrev = document.getElementById('navPrev');
    const nNext = document.getElementById('navNext');
    const nPause = document.getElementById('navPause');

    if (nPrev) nPrev.addEventListener('click', prevPage);
    if (nNext) nNext.addEventListener('click', nextPage);
    if (nPause) nPause.addEventListener('click', () => {
        if (isPaused) resume();
        else pause();
    });
    
    const container = document.querySelector('.story-container');
    let pressTimer;
    let isLongPress = false;

    const handlePressStart = (e) => {
        if (e.target.closest('.story-close') || e.target.closest('.story-ok-btn')) return;
        isLongPress = false;
        pressTimer = setTimeout(() => {
            isLongPress = true;
            pause();
        }, 200);
    };

    const handlePressEnd = () => {
        clearTimeout(pressTimer);
        if (isLongPress) {
            resume();
        }
    };

    if (container) {
        container.addEventListener('mousedown', handlePressStart);
        container.addEventListener('mouseup', handlePressEnd);
        container.addEventListener('mouseleave', handlePressEnd);
        container.addEventListener('touchstart', handlePressStart, { passive: true });
        container.addEventListener('touchend', handlePressEnd, { passive: true });
        container.addEventListener('contextmenu', (e) => { e.preventDefault(); return false; });
    }
    
    const closeBtn = document.getElementById('storyCloseBtn');
    const leaveStory = () => {
        try {
            history.back();
        } catch (e) {
            const basePath = window.location.pathname.replace(/\/[^\/]*$/, '/');
            location.replace(basePath + 'index.html?start=home');
            return;
        }

        setTimeout(() => {
            if (!document.querySelector('.story-container')) return;

            const pageName = (window.location.pathname || '').split('/').pop();
            if (pageName === 'stories.html' || pageName === 'stories') {
                const basePath = window.location.pathname.replace(/\/[^\/]*$/, '/');
                location.replace(basePath + 'index.html?start=home');
                return;
            }

            location.reload();
        }, 180);
    };

    if (closeBtn) closeBtn.addEventListener('click', (e) => {
        e.preventDefault();
        leaveStory();
    });

    const okBtn = document.getElementById('storyOkBtn');
    if (okBtn) okBtn.addEventListener('click', (e) => {
        e.preventDefault();
        leaveStory();
    });

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(initStory, 100));
    } else {
        setTimeout(initStory, 100);
    }
})();
</script>
</body>
