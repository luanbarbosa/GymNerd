<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <title>GymNerd | Remember</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=browse_activity" rel="stylesheet">
    <script src="gn-i18n.js"></script>
    <script src="auth.js"></script>
    <script src="drive-storage.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
    <script src="db.js"></script>
    <script src="background-sync.js"></script>
    <link rel="stylesheet" href="styles/app-titles.css">
    <link rel="stylesheet" href="styles/mode-support.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <style>
        :root { --primary: #3b82f6; --primary-grad: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%); --bg: var(--shell-background); --card: #1e293b; --text: #f8fafc; }
        html { background-color: var(--shell-background); }
        body { font-family: var(--app-font-family); background: var(--shell-background); color: var(--text); max-width:500px;margin:0 auto;padding:0; }
        .top-card { position: static; background: transparent; color: var(--text-main-color); border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; padding: 6px 16px 2px; box-shadow: none; padding-top: calc(6px + constant(safe-area-inset-top)); padding-top: calc(6px + env(safe-area-inset-top)); }
        .top-card-inner { max-width: 100%; display:flex; align-items:center; gap:12px; padding-bottom: 2px; }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: constant(safe-area-inset-top); height: env(safe-area-inset-top); background: var(--shell-background); z-index: 1100; pointer-events: none; }
        .top-card-inner > div { flex-wrap: nowrap; }
        .top-card-inner .app-title-compact, .top-card-inner h2 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .top-card .topbar { background: transparent; padding: 6px 0; display:flex; align-items:center; justify-content:space-between; width:100%; }
        .top-card .back-btn, .top-card .back-btn .material-symbols-outlined { display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
        .back-btn { text-decoration: none; font-size: 1.5rem; color: var(--text-main-color); }
        .page-content { padding: 16px; }
    </style>
</head>
<body>
    <div class="top-card">
        <div class="top-card-inner">
            <div style="display:flex;align-items:center;width:100%;gap:12px;">
                <a href="#" class="back-btn" aria-label="Back" onclick="event.preventDefault(); history.back();"><span class="material-symbols-outlined" aria-hidden="true" style="font-variation-settings: 'wght' 300;">arrow_back</span></a>
                <div style="flex:1;min-width:0;">
                    <h2 class="app-title-compact" style="margin:12px 0;" data-i18n="page_remember">Remember</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="page-content">
        <!-- Blank page content -->
    </div>

<script>
(function() {
    function initPage() {
        try { if (typeof GN_I18N !== 'undefined' && GN_I18N.applyTranslations) GN_I18N.applyTranslations(document); } catch(e){}
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initPage);
    } else {
        initPage();
    }
})();
</script>
</body>
</html>
