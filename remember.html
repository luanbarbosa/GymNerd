<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">
    <title>GymNerd | Remember</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=browse_activity" rel="stylesheet">
    <script src="gn-i18n.js"></script>
    <script src="auth.js"></script>
    <script src="drive-storage.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
    <script src="db.js"></script>
    <script src="background-sync.js"></script>
    <link rel="stylesheet" href="styles/app-titles.css">
    <link rel="stylesheet" href="styles/mode-support.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <style>
        :root { 
            --bg: #000; 
            --text: #fff; 
            --primary: var(--accent-color, #f2c24b);
            --safe-top: constant(safe-area-inset-top);
            --safe-top: env(safe-area-inset-top);
        }
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text);
            font-family: var(--app-font-family, sans-serif);
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        /* Story Container */
        .story-container {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            background: #000;
            z-index: 2000;
            touch-action: manipulation;
        }

        /* Progress Bars */
        .story-progress-container {
            position: absolute;
            top: calc(10px + var(--safe-top, 0px));
            left: 10px;
            right: 10px;
            display: flex;
            gap: 4px;
            z-index: 10;
        }
        .story-progress-bar {
            height: 3px;
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }
        .story-progress-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            transition: width 0.1s linear;
        }
        .story-container.paused .story-progress-fill {
            transition: none !important;
        }

        /* Pages */
        .story-pages {
            flex: 1;
            position: relative;
        }
        .story-page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            align-items: center;
            justify-content: flex-start;
            padding: 80px 24px 40px;
            box-sizing: border-box;
            text-align: center;
        }
        .story-page.active { display: flex; }
        
        .story-content-inner {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        /* Navigation */
        .story-nav {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            z-index: 5;
        }
        .story-nav-prev { width: 30%; height: 100%; }
        .story-nav-next { width: 70%; height: 100%; }

        .story-close {
            position: absolute;
            top: calc(20px + var(--safe-top, 0px));
            right: 15px;
            z-index: 11;
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Content Styles */
        .story-title { font-size: 3.5rem; font-weight: 900; margin: 0; color: var(--primary); letter-spacing: -0.04em; line-height: 1; }
        .token-row { display: flex; gap: 40px; margin-top: 20px; }
        .token-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .token-val { font-size: 4rem; font-weight: 900; line-height: 1; min-width: 1ch; }
        .token-hero-icon {
            width: 120px;
            height: 120px;
            margin: 20px 0;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
            opacity: 0;
        }
        .story-page.active.animating .token-hero-icon {
            animation: dropIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1.2) forwards;
        }
        .stat-label { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; font-weight: 800; letter-spacing: 0.1em; }

        /* Calendar Grid */
        .calendar-story-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            width: 100%;
            max-width: 320px;
        }
        .calendar-day-item {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            padding: 2px;
        }
        .calendar-day-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
        }

        /* KEYFRAME ANIMATIONS */
        @keyframes dropIn {
            0% { transform: scale(1.6) translateY(-40px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes fadeInUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* TRIGGER CLASSES */
        .story-page.active .story-title {
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .story-page.active.animating .calendar-day-item img {
            animation: dropIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1.2) forwards;
        }

        .calendar-summary {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 280px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            opacity: 0;
        }
        .story-page.active.animating .calendar-summary {
            animation: fadeInUp 0.6s ease 1s forwards;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .summary-icon { width: 36px; height: 36px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); }
        .summary-label { flex: 1; font-weight: 800; font-size: 1.1rem; text-align: left; }
        .summary-count { font-weight: 900; font-size: 1.5rem; color: #fff; }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="story-container">
            <div class="story-progress-container" id="progressContainer"></div>
            <a href="#" class="story-close" id="storyCloseBtn">
                <span class="material-symbols-outlined">close</span>
            </a>

            <div class="story-nav">
                <div class="story-nav-prev" id="navPrev"></div>
                <div class="story-nav-next" id="navNext"></div>
            </div>

            <div class="story-pages" id="pagesContainer">
                <!-- Page 1: Frequency -->
                <div class="story-page" id="page1">
                    <div class="story-content-inner">
                        <h2 class="story-title" data-i18n="workout_frequency">Frequency</h2>
                        <div id="calendarContainer" class="calendar-story-grid"></div>
                        <div id="calendarSummary" class="calendar-summary"></div>
                    </div>
                </div>

                <!-- Page 2: Rest Tokens -->
                <div class="story-page" id="page2">
                    <div class="story-content-inner" style="gap: 24px;">
                        <h2 class="story-title" data-i18n="story_status_rest_title">Rest tokens</h2>
                        
                        <img src="icons/coin1.svg" class="token-hero-icon" alt="">

                        <div class="token-row" style="margin-top: 0;">
                            <div class="token-item">
                                <div class="token-val" id="tokensGained">0</div>
                                <div class="stat-label" data-i18n="gained">Gained</div>
                            </div>
                            <div class="token-item">
                                <div class="token-val" id="tokensUsed">0</div>
                                <div class="stat-label" data-i18n="used">Used</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
(function() {
    let currentPage = 0;
    let progressInterval;
    let startTime;
    let isPaused = false;
    let pausedAt = 0;
    const DURATION = 6000;

    async function initStory() {
        try {
            document.body.style.overflow = 'hidden';
            const container = document.querySelector('.main-content');
            if (container) {
                container.style.margin = '0';
                container.style.maxWidth = 'none';
                container.style.padding = '0';
            }
        } catch(e){}

        if (window.GN_I18N) GN_I18N.applyTranslations(document);
        
        const now = new Date();
        const year = now.getMonth() === 0 ? now.getFullYear() - 1 : now.getFullYear();
        const month = now.getMonth() === 0 ? 11 : now.getMonth() - 1;

        const startStr = `${year}-${String(month + 1).padStart(2, '0')}-01`;
        const lastDay = new Date(year, month + 1, 0).getDate();
        const endStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;

        try {
            if (window.db) {
                await db.open();
                const logs = await db.history.where('date').between(startStr, endStr, true, true).toArray();
                const uniqueDates = [...new Set(logs.map(l => l.date))];
                const tokenEvents = await db.token_events.where('date').between(startStr, endStr, true, true).toArray();
                const gained = tokenEvents.reduce((acc, e) => acc + (e.tokensDelta || 0), 0);
                const frozenDays = await db.frozen_days.where('date').between(startStr, endStr, true, true).toArray();
                const used = frozenDays.length;

                const gEl = document.getElementById('tokensGained');
                const uEl = document.getElementById('tokensUsed');
                if (gEl) gEl.innerText = gained;
                if (uEl) uEl.innerText = used;

                renderCalendarStory(uniqueDates, year, month, frozenDays.map(f => f.date));
            }
        } catch (e) {
            console.error('Story data load failed', e);
        }

        const pages = document.querySelectorAll('.story-page');
        const progressContainer = document.getElementById('progressContainer');
        if (progressContainer) {
            progressContainer.innerHTML = '';
            pages.forEach(() => {
                const bar = document.createElement('div');
                bar.className = 'story-progress-bar';
                bar.innerHTML = '<div class="story-progress-fill"></div>';
                progressContainer.appendChild(bar);
            });
        }

        setTimeout(() => showPage(0), 100);
    }

    function renderCalendarStory(workoutDates, year, month, frozenDates) {
        const container = document.getElementById('calendarContainer');
        const summary = document.getElementById('calendarSummary');
        if (!container || !summary) return;
        
        container.innerHTML = '';
        summary.innerHTML = '';
        const workoutSet = new Set(workoutDates);
        const frozenSet = new Set(frozenDates);
        
        let doneCount = 0;
        let restCount = 0;
        let missedCount = 0;
        
        const lang = (window.GN_I18N && typeof GN_I18N.safeGetLang === 'function') ? GN_I18N.safeGetLang() : 'en';
        const weekStartsOnMonday = (lang === 'pt');
        
        const firstDayIndex = new Date(year, month, 1).getDay();
        const adjustedFirstDayIndex = weekStartsOnMonday ? ((firstDayIndex + 6) % 7) : firstDayIndex;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        for (let i = 0; i < adjustedFirstDayIndex; i++) {
            const empty = document.createElement('div');
            empty.className = 'calendar-day-item';
            empty.style.background = 'transparent';
            empty.style.border = 'none';
            container.appendChild(empty);
        }
        
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const item = document.createElement('div');
            item.className = 'calendar-day-item';
            
            let iconSrc = 'icons/day-missed.svg';
            if (workoutSet.has(dateStr)) {
                iconSrc = 'icons/day-done.svg';
                doneCount++;
            } else if (frozenSet.has(dateStr)) {
                iconSrc = 'icons/day-rest.svg';
                restCount++;
            } else {
                missedCount++;
            }
            
            const img = document.createElement('img');
            img.src = iconSrc;
            img.style.animationDelay = `${(d-1) * 30}ms`;
            item.appendChild(img);
            container.appendChild(item);
        }

        const summaryItems = [
            { icon: 'icons/day-done.svg', count: doneCount, label: 'story_status_done' },
            { icon: 'icons/day-rest.svg', count: restCount, label: 'story_status_rest' },
            { icon: 'icons/day-missed.svg', count: missedCount, label: 'story_status_missed' }
        ];
        
        summaryItems.forEach(item => {
            const row = document.createElement('div');
            row.className = 'summary-item';
            const localizedLabel = (window.GN_I18N && typeof GN_I18N.t === 'function') ? GN_I18N.t(item.label) : item.label;
            row.innerHTML = `
                <img src="${item.icon}" class="summary-icon">
                <div class="summary-label">${localizedLabel}</div>
                <div class="summary-count">${item.count}</div>
            `;
            summary.appendChild(row);
        });
    }

    function showPage(index) {
        const pages = document.querySelectorAll('.story-page');
        if (!pages.length || index < 0 || index >= pages.length) return;
        
        const container = document.querySelector('.story-container');
        if (container) container.classList.remove('paused');
        
        if (progressInterval) clearInterval(progressInterval);
        
        pages.forEach(p => {
            p.classList.remove('active');
            p.classList.remove('animating');
            p.style.display = 'none';
        });
        
        currentPage = index;
        const page = pages[currentPage];
        page.style.display = 'flex';
        page.classList.add('active');
        
        setTimeout(() => {
            if (document.body.contains(page)) {
                page.classList.add('animating');
            }
        }, 10);

        const fills = document.querySelectorAll('.story-progress-fill');
        fills.forEach((fill, i) => {
            if (i < index) fill.style.width = '100%';
            else fill.style.width = '0%';
        });

        isPaused = false;
        pausedAt = 0;
        startTime = Date.now();
        progressInterval = setInterval(() => {
            if (!document.body.contains(pages[0])) {
                clearInterval(progressInterval);
                return;
            }
            if (isPaused) return;

            const elapsed = Date.now() - startTime;
            const progress = (elapsed / DURATION) * 100;
            
            if (progress >= 100) {
                if (fills[index]) fills[index].style.width = '100%';
                if (currentPage < pages.length - 1) {
                    nextPage();
                } else {
                    clearInterval(progressInterval);
                    history.back();
                }
            } else {
                if (fills[index]) fills[index].style.width = progress + '%';
            }
        }, 30);
    }

    function pause() {
        if (isPaused) return;
        isPaused = true;
        pausedAt = Date.now();
        const container = document.querySelector('.story-container');
        if (container) container.classList.add('paused');
    }

    function resume() {
        if (!isPaused) return;
        isPaused = false;
        const container = document.querySelector('.story-container');
        if (container) container.classList.remove('paused');
        const pauseDuration = Date.now() - pausedAt;
        startTime += pauseDuration;
    }

    function nextPage() {
        const pages = document.querySelectorAll('.story-page');
        if (currentPage < pages.length - 1) showPage(currentPage + 1);
        else history.back();
    }

    function prevPage() {
        if (currentPage > 0) showPage(currentPage - 1);
    }

    const nPrev = document.getElementById('navPrev');
    const nNext = document.getElementById('navNext');
    if (nPrev) nPrev.addEventListener('click', prevPage);
    if (nNext) nNext.addEventListener('click', nextPage);
    
    const container = document.querySelector('.story-container');
    if (container) {
        container.addEventListener('mousedown', (e) => {
            if (e.target.id === 'navPrev' || e.target.id === 'navNext' || e.target.closest('.story-close')) return;
            pause();
        });
        container.addEventListener('mouseup', resume);
        container.addEventListener('mouseleave', resume);
        container.addEventListener('touchstart', (e) => {
            if (e.target.id === 'navPrev' || e.target.id === 'navNext' || e.target.closest('.story-close')) return;
            pause();
        }, { passive: true });
        container.addEventListener('touchend', resume, { passive: true });
        container.addEventListener('contextmenu', (e) => { e.preventDefault(); return false; });
    }
    
    const closeBtn = document.getElementById('storyCloseBtn');
    if (closeBtn) closeBtn.addEventListener('click', (e) => {
        e.preventDefault();
        history.back();
    });

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(initStory, 100));
    } else {
        setTimeout(initStory, 100);
    }
})();
</script>
</body>
</html>
